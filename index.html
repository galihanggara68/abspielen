<!DOCTYPE html>
<html lang="en">
    <head>
    	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	    <title>Abspielen</title>
		<script type="module" src="/src/main.js" defer></script>
    </head>
    <body :class="{ 'dark': darkMode }" x-data="app" @navigate.window="navigate($event.detail)" @toggle-dark-mode.window="toggleDarkMode()">
        <header class="top-header" x-show="currentScreen !== 'onboarding'">
            <h1>Abspielen</h1>
            <div style="font-weight: 600; color: #ff9800; display: flex; align-items: center; gap: 4px;" x-show="$store.session && $store.session.currentStreak > 0">
                🔥 <span x-text="$store.session.currentStreak"></span>
            </div>
        </header>

        <main>
            <template x-if="currentScreen === 'onboarding'">
                <div x-component.url="'/components/onboarding.html'"></div>
            </template>

            <template x-if="currentScreen === 'home' || currentScreen === ''">
                <div x-component.url="'/components/home.html'"></div>
            </template>
            
            <template x-if="currentScreen === 'practice'">
                <div x-component.url="'/components/practice.html'"></div>
            </template>

            <template x-if="currentScreen === 'last-session'">
                <div x-component.url="'/components/last-session.html'"></div>
            </template>

            <template x-if="currentScreen === 'stats'">
                <div x-component.url="'/components/stats.html'"></div>
            </template>

            <template x-if="currentScreen === 'settings'">
                <div x-component.url="'/components/settings.html'"></div>
            </template>

            <template x-if="currentScreen === 'credits'">
                <div x-component.url="'/components/credits.html'"></div>
            </template>
        </main>

        <nav class="bottom-nav" x-show="currentScreen !== 'onboarding'">
            <button :class="{ 'active': currentScreen === 'home' }" @click="navigate('home')" aria-label="Home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </button>
            <button :class="{ 'active': currentScreen === 'practice' }" @click="navigate('practice')" aria-label="Practice">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                Practice
            </button>
            <button :class="{ 'active': currentScreen === 'stats' || currentScreen === 'last-session' }" @click="navigate('stats')" aria-label="Stats">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                Stats
            </button>
            <button :class="{ 'active': currentScreen === 'settings' || currentScreen === 'credits' }" @click="navigate('settings')" aria-label="Settings">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35C8.66 5.59 8.12 5.92 7.63 6.29L5.24 5.33c-.22-.08-.47 0-.59.22L2.73 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Settings
            </button>
        </nav>

        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: flex; flex-direction: column; align-items: center; padding: 1rem; gap: 1rem;" x-show="globalErrors.length > 0">
            <template x-for="error in globalErrors" :key="error.id">
                <div style="pointer-events: auto; background: var(--bg-color-card); color: var(--text-color); border: 2px solid var(--error); border-radius: 8px; padding: 1rem; max-width: 400px; width: 100%; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
                        <strong style="color: var(--error);">Error: <span x-text="error.summary"></span></strong>
                        <button @click="dismissError(error.id)" style="background: none; border: none; color: inherit; padding: 0.2rem 0.5rem; font-size: 1.5rem; line-height: 1; cursor: pointer; box-shadow: none;">&times;</button>
                    </div>
                    <div style="margin-top: 0.5rem;">
                        <button @click="error.expanded = !error.expanded" style="font-size: 0.8rem; padding: 4px 8px; box-shadow: none; background: var(--border-color); color: var(--text-color);" x-text="error.expanded ? 'Hide Details' : 'Show Details'"></button>
                    </div>
                    <div x-show="error.expanded" style="margin-top: 0.5rem; background: #222; color: #0f0; padding: 0.5rem; border-radius: 4px; overflow-x: auto; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap;" x-text="error.details">
                    </div>
                </div>
            </template>
        </div>
    </body>
</html>
