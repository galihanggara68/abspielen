<div x-data="stats" class="screen">
    <h2>Stats</h2>
    
    <div class="dashboard-metrics" style="margin-top: 1.5rem;">
        <div class="metric-card">
            <h3 x-text="data?.retentionRate + '%'">0%</h3>
            <p>Retention</p>
        </div>
        <div class="metric-card">
            <h3 x-text="data?.sessionStreak">0</h3>
            <p>Day Streak</p>
        </div>
    </div>

    <button @click="navigate('last-session')" style="width: 100%; margin-bottom: 2rem; background: var(--bg-color-card); color: var(--primary-color); border: 1px solid var(--primary-color);">View Last Session Log</button>

    <div>
        <h3>Activity Heatmap</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 4px; max-width: 100%; margin-top: 1rem;">
            <template x-for="item in data?.heatmap" :key="item.date">
                <div :title="`${item.date}: ${item.count} reviews`" 
                     style="width: 12px; height: 12px; border-radius: 2px;"
                     :style="`background-color: ${item.count > 20 ? 'var(--success)' : item.count > 10 ? '#34D399' : item.count > 0 ? '#6EE7B7' : 'var(--border-color)'}`">
                </div>
            </template>
        </div>
    </div>
</div>
