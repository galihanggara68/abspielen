<div x-data="settings" class="screen" style="max-width: 500px; padding-top: 2rem;">
    <!-- Top Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin: 0;">Settings</h2>
    </div>

    <!-- Menu List -->
    <div style="background: transparent;">
        
        <div class="list-item" @click="checkUpdates()">
            <span>Data Sync</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span x-show="syncing" class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></span>
                <span x-show="!syncing" style="color: var(--primary-color); font-size: 0.9rem;" x-text="syncResult"></span>
                <span class="chevron">›</span>
            </div>
        </div>

        <div class="list-item">
            <span>Audio-First Mode</span>
            <label class="toggle-switch">
                <input type="checkbox" :checked="audioFirstMode" @change="toggleAudioFirstMode()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="list-item">
            <span>Cloze Deletion Mode</span>
            <label class="toggle-switch">
                <input type="checkbox" :checked="clozeMode" @change="toggleClozeMode()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="list-item">
            <span>Dark Mode</span>
            <label class="toggle-switch">
                <input type="checkbox" :checked="darkMode" @change="toggleDarkMode()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="list-item" @click="resetProgress()">
            <span style="color: var(--error);">Reset Progress</span>
            <span class="chevron">›</span>
        </div>

        <div class="list-item" @click="navigate('credits')">
            <span>Credits</span>
            <span class="chevron">›</span>
        </div>
        
    </div>
</div>
